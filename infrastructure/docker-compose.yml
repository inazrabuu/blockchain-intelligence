services:
  postgres:
    image: postgres:17
    container_name: blockchain-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blockchain

    ports:
      - "5431:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blockchain"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: blockchain-redis
    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ingestion-service:
    build:
      context: ..
      dockerfile: Dockerfile.ingestion
    container_name: blockchain-ingestion
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blockchain
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-service:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: blockchain-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blockchain
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: blockchain-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-service
      - ingestion-service

  grafana:
    image: grafana/grafana:12.1.1
    container_name: blockchain-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
