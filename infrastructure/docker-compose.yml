services:
  postgres:
    image: postgres:17
    container_name: blockchain-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blockchain

    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: blockchain-redis
    ports:
      - "6379:6379"

  ingestion-service:
    build:
      context: ..
      dockerfile: Dockerfile.ingestion
    container_name: blockchain-ingestion
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blockchain
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    depends_on:
      - postgres
      - redis

  api-service:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: blockchain-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blockchain
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

volumes:
  postgres_data:
